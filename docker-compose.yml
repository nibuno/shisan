services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shisan
      POSTGRES_USER: shisan
      POSTGRES_PASSWORD: shisan
    ports:
      # Use a non-default host port so local PostgreSQL on 5432 can coexist.
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shisan -d shisan"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DJANGO_ENV: development
      DJANGO_SECRET_KEY: django-insecure-dev-only-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,web
      DATABASE_URL: postgresql://shisan:shisan@db:5432/shisan
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      CSRF_TRUSTED_ORIGINS: http://localhost:8080
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  web:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
